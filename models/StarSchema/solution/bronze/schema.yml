version: 2

models:
  - name: bronze_ss_stg_customers
    description: >
      Star Schema bronze staging for customers. Prepares data for SCD2
      dimension loading in the silver layer.
    columns:
      - name: cust_id
        description: Primary key for the customer.
        data_type: integer
        data_tests: [not_null, unique]
      - name: cust_email
        description: Standardized email address for the customer.
        data_type: varchar
        data_tests: [not_null, unique]

  - name: bronze_ss_stg_products
    description: Star Schema bronze staging for products.
    columns:
      - name: prod_id
        description: Primary key for the product.
        data_type: integer
        data_tests: [not_null, unique]
      - name: price
        description: Current list price of the product.
        data_type: double
        data_tests: [not_null]

  - name: bronze_ss_stg_orders
    description: >
      Star Schema bronze staging for orders. Denormalizes unit price/cost
      from products at order time for the fact table grain.
    columns:
      - name: order_id
        description: Primary key for the order.
        data_type: integer
        data_tests: [not_null, unique]
      - name: cust_id
        description: Foreign key referencing the customer who placed the order.
        data_type: integer
        data_tests: [not_null]
      - name: prod_id
        description: Foreign key referencing the product ordered.
        data_type: integer
        data_tests: [not_null]
      - name: gross_revenue
        description: Calculated revenue for this order line (quantity * unit_price * (1 - discount)).
        data_type: double
        data_tests: [not_null]
