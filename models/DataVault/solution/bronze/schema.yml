version: 2

models:
  - name: bronze_dv_stg_customers
    description: >
      Data Vault bronze staging for customers. Computes `hk_customer` (MD5 of cust_id)
      and `hash_diff` across all descriptive attributes for satellite change detection.
    columns:
      - name: hk_customer
        description: "MD5 hash key derived from cust_id (business key)."
        data_type: varchar
        data_tests: [not_null, unique]
      - name: cust_id
        data_type: integer
        data_tests: [not_null, unique]
      - name: hash_diff
        data_type: varchar
        data_tests: [not_null]
      - name: load_date
        data_type: timestamp
        data_tests: [not_null]

  - name: bronze_dv_stg_products
    description: >
      Data Vault bronze staging for products. Computes `hk_product` (MD5 of prod_id).
    columns:
      - name: hk_product
        data_type: varchar
        data_tests: [not_null, unique]
      - name: prod_id
        data_type: integer
        data_tests: [not_null, unique]
      - name: hash_diff
        data_type: varchar
        data_tests: [not_null]

  - name: bronze_dv_stg_orders
    description: >
      Data Vault bronze staging for orders. Generates four hash keys:
      hk_order, hk_customer, hk_product, and hk_order_link (composite).
    columns:
      - name: hk_order
        data_type: varchar
        data_tests: [not_null, unique]
      - name: hk_customer
        data_type: varchar
        data_tests: [not_null]
      - name: hk_product
        data_type: varchar
        data_tests: [not_null]
      - name: hk_order_link
        data_type: varchar
        data_tests: [not_null, unique]
      - name: order_id
        data_type: integer
        data_tests: [not_null, unique]
