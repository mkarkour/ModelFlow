version: 2

models:
  - name: bv_customer_latest
    description: >
      Data Vault Business Vault: Latest Customer. Point-in-time view joining
      Hub Customer to the most recent Satellite snapshot. The Business Vault
      is a layer on top of the Raw Vault designed for ease-of-use by consumers.
    columns:
      - name: hk_customer
        tests: [not_null, unique]
      - name: cust_id
        tests: [not_null, unique]
      - name: cust_email
        tests: [not_null]

  - name: bv_sales_summary
    description: >
      Data Vault Business Vault: Sales Summary. Assembles sales data from
      Link_Order and three Satellites into one consumable dataset.
      Demonstrates the key DV pattern: join Hub/Link/Sat at query time.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: cust_name
        tests: [not_null]
      - name: product_name
        tests: [not_null]
      - name: gross_revenue
        tests: [not_null]
