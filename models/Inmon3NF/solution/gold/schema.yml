version: 2

models:
  - name: rpt_sales_by_customer
    description: >
      Inmon 3NF Gold: Pre-aggregated customer sales report. Built from normalized
      CDW silver layer (fact_order_3nf + dim_customer_3nf).
    columns:
      - name: cust_id
        tests: [not_null, unique]
      - name: total_gross_revenue
        tests: [not_null]
      - name: total_orders
        tests: [not_null]

  - name: rpt_sales_by_product
    description: >
      Inmon 3NF Gold: Pre-aggregated product sales report with margin analysis.
    columns:
      - name: prod_id
        tests: [not_null, unique]
      - name: total_gross_revenue
        tests: [not_null]
      - name: gross_margin_pct
        tests: [not_null]
