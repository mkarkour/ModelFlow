version: 2

models:
  - name: py_rpt_customer_ltv
    description: >
      Customer Lifetime Value Analysis (Python Model).
      Computes Customer Lifetime Value (CLV) metrics including purchase frequency,
      average order value, and projected annual value.
    config:
      materialized: table
      schema: inmon_gold
      tags: ["inmon_3nf", "gold", "python"]
    columns:
      - name: cust_id
        description: "Customer natural key."
        data_type: integer
        data_tests: [not_null, unique]
      - name: cust_name
        description: "Customer name."
        data_type: varchar
      - name: cust_segment
        description: "Customer segment."
        data_type: varchar
      - name: cust_country
        description: "Customer country."
        data_type: varchar
      - name: total_orders
        description: "Total number of non-cancelled orders by the customer."
        data_type: integer
        data_tests: [not_null]
      - name: total_revenue
        description: "Total gross revenue generated by the customer."
        data_type: double
        data_tests: [not_null]
      - name: total_margin
        description: "Total gross margin generated by the customer."
        data_type: double
        data_tests: [not_null]
      - name: first_order
        description: "Date of the customer's first order."
        data_type: timestamp
      - name: last_order
        description: "Date of the customer's most recent order."
        data_type: timestamp
      - name: customer_lifespan_days
        description: "Number of days between the first and last order."
        data_type: integer
      - name: avg_order_value
        description: "Average revenue per order."
        data_type: double
      - name: avg_margin_per_order
        description: "Average margin per order."
        data_type: double
      - name: purchase_frequency
        description: "Estimated annual purchase frequency based on historical lifespan."
        data_type: double
      - name: projected_annual_value
        description: "Estimated projected annual value (AOV * purchase frequency)."
        data_type: double
      - name: clv_tier
        description: "Customer tier (High, Medium, Low) based on percentiles of projected annual value."
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']
