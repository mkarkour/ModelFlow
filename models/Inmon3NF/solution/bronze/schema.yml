version: 2

models:
  - name: bronze_3nf_stg_customers
    description: >
      Inmon 3NF bronze staging for customers. Cleanses types and standardizes
      casing. No hash keys — uses natural PKs (cust_id) for FK enforcement.
    columns:
      - name: cust_id
        tests: [not_null, unique]
      - name: cust_email
        tests: [not_null, unique]
      - name: cust_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Consumer', 'Corporate', 'Home Office']

  - name: bronze_3nf_stg_products
    description: "Inmon 3NF bronze staging for products."
    columns:
      - name: prod_id
        tests: [not_null, unique]
      - name: sku
        tests: [not_null, unique]
      - name: price
        tests: [not_null]

  - name: bronze_3nf_stg_orders
    description: "Inmon 3NF bronze staging for orders."
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: cust_id
        tests: [not_null]
      - name: prod_id
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['Shipped', 'Cancelled', 'Pending', 'Returned']
