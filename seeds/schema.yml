version: 2

seeds:
  - name: raw_customers
    description: "Raw e-commerce customer records generated by the data factory notebook."
    columns:
      - name: cust_id
        description: "Unique customer identifier (business key)."
        tests:
          - unique
          - not_null
      - name: name
        tests: [not_null]
      - name: email
        tests:
          - unique
          - not_null
      - name: country
        tests: [not_null]
      - name: city
        tests: [not_null]
      - name: segment
        tests:
          - not_null
          - accepted_values:
              values: ['Consumer', 'Corporate', 'Home Office']
      - name: created_at
        tests: [not_null]
      - name: updated_at
        tests: [not_null]

  - name: raw_products
    description: "Raw product catalog records."
    columns:
      - name: prod_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests: [not_null]
      - name: category
        tests:
          - not_null
          - accepted_values:
              values: ['Electronics', 'Apparel', 'Home', 'Toys', 'Sports']
      - name: price
        tests: [not_null]
      - name: sku
        tests:
          - unique
          - not_null

  - name: raw_orders
    description: "Raw order transaction records."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: cust_id
        tests: [not_null]
      - name: prod_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: quantity
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['Shipped', 'Cancelled', 'Pending', 'Returned']
      - name: channel
        tests:
          - not_null
          - accepted_values:
              values: ['Web', 'Mobile', 'In-Store', 'Partner']

  - name: raw_shipments
    description: "Raw shipment / fulfillment records (only for Shipped and Returned orders)."
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests: [not_null]
      - name: carrier
        tests:
          - not_null
          - accepted_values:
              values: ['DHL', 'FedEx', 'UPS', 'USPS', 'DPD']
      - name: ship_date
        tests: [not_null]
      - name: delivery_date
        tests: [not_null]
