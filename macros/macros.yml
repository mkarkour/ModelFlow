version: 2

macros:
  - name: check_mode
    description: >
      Logs the current dbt mode being executed (either 'exercise' or 'solution'). 
      Useful for verifying which part of the workshop or project is currently running.

  - name: hash_diff
    description: >
      Generates a hash diff for Data Vault Satellites to detect row changes.
      Combines all descriptive attributes into a single MD5 fingerprint.
    arguments:
      - name: columns
        type: list
        description: A list of column names (attributes) to combine into the hash diff fingerprint.

  - name: hash_key
    description: >
      Generates a Data Vault-style Hash Key using MD5.
      Pass a list of column names that form the business key. Nulls are replaced with '^^' to avoid hash collisions.
    arguments:
      - name: columns
        type: list
        description: A list of column names that form the business key to be hashed.

  - name: load_date
    description: >
      Returns the current UTC timestamp as the Load Date for Data Vault patterns.
      In production this would typically be the pipeline execution timestamp.
